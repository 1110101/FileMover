name: Build and Release

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
        
    - name: Run Integration Tests
      run: |
        python tests/test_integration.py
        
    - name: Build with PyInstaller
      run: |
        pyinstaller move.spec --noconfirm --log-level ERROR
        
    - name: Verify executable
      run: |
        if (Test-Path "dist\FileMover.exe") {
          Write-Host "✓ FileMover.exe created successfully"
          $fileSize = (Get-Item "dist\FileMover.exe").Length / 1MB
          Write-Host "File size: $([math]::Round($fileSize, 2)) MB"
        } else {
          Write-Error "✗ FileMover.exe not found!"
          exit 1
        }
      shell: pwsh
        
    - name: Get version
      id: version
      shell: bash
      run: |
        if [[ $GITHUB_REF == refs/tags/* ]]; then
          VERSION=${GITHUB_REF#refs/tags/}
        else
          VERSION=$(cat VERSION)
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Building version: $VERSION"
        
    - name: Install Inno Setup
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        choco install innosetup -y
        
    - name: Build installer
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        if (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
        } else {
          iscc installer.iss
        }
      shell: pwsh
      
    - name: Verify installer
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        $installerPath = Get-ChildItem -Path "installer_output" -Filter "FileMover-*-Setup.exe" -Recurse | Select-Object -First 1
        if ($installerPath) {
          Write-Host "✓ Installer created: $($installerPath.Name)"
          $fileSize = $installerPath.Length / 1MB
          Write-Host "File size: $([math]::Round($fileSize, 2)) MB"
        } else {
          Write-Error "✗ Installer not found!"
          exit 1
        }
      shell: pwsh
        
    - name: Upload standalone executable
      uses: actions/upload-artifact@v4
      with:
        name: FileMover-${{ steps.version.outputs.version }}-Standalone
        path: dist/FileMover.exe
        retention-days: 90
        
    - name: Upload installer
      if: startsWith(github.ref, 'refs/tags/v')
      uses: actions/upload-artifact@v4
      with:
        name: FileMover-${{ steps.version.outputs.version }}-Installer
        path: installer_output/*.exe
        retention-days: 90
        
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/FileMover.exe
          installer_output/*.exe
        body: |
          ## FileMover ${{ steps.version.outputs.version }}
          
          > 🚧 **Work in Progress** • Mostly AI Vibe Coded
          
          ### 📦 Installation Options
          
          **Option 1: Installer (Recommended)**
          Download `FileMover-*-Setup.exe` for a complete installation with:
          - Automatic uninstaller
          - Start menu shortcuts
          - Optional desktop icon
          - Optional Windows autostart
          
          **Option 2: Standalone Executable**
          Download `FileMover.exe` to run directly without installation (portable).
          
          ### ⚠️ Windows SmartScreen Warning
          
          These builds are **not code-signed** (certificates cost $300+/year). Windows SmartScreen may show a warning on first run:
          1. Click "More info"
          2. Click "Run anyway"
          
          This is normal for open-source software.
          
          ### 🚀 Features
          
          See [README.md](https://github.com/${{ github.repository }}/blob/master/README.md) for full documentation.
          
          ### 📋 What's Changed
          
          See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md) for detailed changes.
          
          ### 💻 Requirements
          
          - Windows 10 or higher
          - No Python or other dependencies required
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
