name: Build Executable

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Build with PyInstaller
      run: |
        pyinstaller move.spec --noconfirm --log-level ERROR
        
    - name: Get version
      id: version
      shell: bash
      run: |
        if [[ $GITHUB_REF == refs/tags/* ]]; then
          VERSION=${GITHUB_REF#refs/tags/}
        else
          VERSION=$(cat VERSION)
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Building version: $VERSION"
        
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: FileMover-${{ steps.version.outputs.version }}-Windows
        path: dist/move.exe
        retention-days: 90
        
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: dist/move.exe
        body: |
          ## FileMover ${{ steps.version.outputs.version }}
          
          ### 📦 Download
          Download the `move.exe` file below and run it on Windows.
          
          ### 🚀 Features
          See [README.md](https://github.com/${{ github.repository }}/blob/master/README.md) for full feature list and documentation.
          
          ### 📋 Changelog
          See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md) for detailed changes.
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

